# Tiles Deploy Workflow
#
# Triggers on every PR and main push (no paths filter).
# PR:   detect tile changes → upload new tiles to DEV bucket → Pages preview deploy (<branch>.world-history-map.pages.dev)
# Main: detect tile changes → upload new tiles to PROD bucket → Pages production deploy (world-history-map.pages.dev)
#
# Pages is deployed with `wrangler pages deploy` (Direct Upload) using apps/worker/wrangler.toml,
# so every Cloudflare setting lives in git. The deploy runs after the R2 upload, so the frontend
# never references tiles that are not in R2 yet. The Pages project is created on first run.
#
# Local dry-run with act (https://github.com/nektos/act):
#   act pull_request \
#     --secret CLOUDFLARE_API_TOKEN=<your-token> \
#     --secret CLOUDFLARE_ACCOUNT_ID=<your-account-id> \
#     --workflows .github/workflows/tiles-deploy.yml
#
# To simulate a tile-changing PR, ensure packages/tiles/src/ differs from the base branch.
# The "Upload new tiles to DEV bucket" step runs only if tile changes are detected.
#
# Required Secrets:
#   CLOUDFLARE_API_TOKEN   — Account permissions: Cloudflare Pages: Edit, Workers R2 Storage: Edit
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare account identifier

name: Tiles Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - '**'
  push:
    branches:
      - main

env:
  DEV_BUCKET: world-history-map-tiles-dev
  PROD_BUCKET: world-history-map-tiles-prod

jobs:
  deploy:
    name: ${{ github.event_name == 'push' && 'Deploy to PROD' || 'Deploy Preview' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # WHY: Dependabot / fork PRs get no repository secrets; skip preview deploys there
      # instead of failing. Production (push) deploys always require the secrets.
      CAN_DEPLOY: ${{ github.event_name == 'push' || secrets.CLOUDFLARE_API_TOKEN != '' }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Add wrangler to PATH
        run: echo "${{ github.workspace }}/apps/worker/node_modules/.bin" >> $GITHUB_PATH

      - name: Verify manifest is up to date
        run: pnpm --filter @world-history-map/tiles run build:check

      - name: Build hashed tiles
        run: pnpm --filter @world-history-map/tiles run build

      - name: Detect tile changes
        id: tile-changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            CHANGED=$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" -- packages/tiles/src/ 2>/dev/null || echo "")
          else
            git fetch origin "$BASE_REF" --depth=1
            CHANGED=$(git diff --name-only "origin/$BASE_REF...HEAD" -- packages/tiles/src/)
          fi
          if [ -n "$CHANGED" ]; then
            echo "has_tile_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tile_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload new tiles to DEV bucket
        if: github.event_name == 'pull_request' && steps.tile-changes.outputs.has_tile_changes == 'true'
        run: |
          for f in packages/tiles/dist/*.pmtiles; do
            key=$(basename "$f")
            if ! wrangler r2 object get "$DEV_BUCKET/$key" --pipe > /dev/null 2>&1; then
              echo "Uploading $key to DEV..."
              wrangler r2 object put "$DEV_BUCKET/$key" --file "$f" --remote
            else
              echo "Skipping $key (already exists)"
            fi
          done

      - name: Upload new tiles to PROD bucket
        if: github.event_name == 'push' && steps.tile-changes.outputs.has_tile_changes == 'true'
        run: |
          for f in packages/tiles/dist/*.pmtiles; do
            key=$(basename "$f")
            if ! wrangler r2 object get "$PROD_BUCKET/$key" --pipe > /dev/null 2>&1; then
              echo "Uploading $key to PROD..."
              wrangler r2 object put "$PROD_BUCKET/$key" --file "$f" --remote
            else
              echo "Skipping $key (already exists)"
            fi
          done

      - name: Build frontend
        run: pnpm build

      - name: Create Pages project if missing
        if: env.CAN_DEPLOY == 'true'
        working-directory: apps/worker
        run: |
          if ! wrangler pages project list | grep -q "world-history-map "; then
            wrangler pages project create world-history-map --production-branch main
          fi

      - name: Deploy to Cloudflare Pages
        if: env.CAN_DEPLOY == 'true'
        working-directory: apps/worker
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: wrangler pages deploy --branch "$BRANCH" --commit-hash "$GITHUB_SHA" --commit-dirty=true
